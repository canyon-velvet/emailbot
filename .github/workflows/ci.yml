name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job: nothing here writes to the repo.
permissions:
  contents: read

env:
  UV_LOCKED: "1" # every uv command fails if uv.lock is out of date

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.x"] # the minimum, and the latest stable release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true # the newest release, not whatever the runner image has cached
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known # only uv releases whose checksum the action knows
      - name: Use this Python for every uv command (overrides .python-version)
        env:
          INTERPRETER: ${{ steps.python.outputs.python-path }}
        run: echo "UV_PYTHON=$INTERPRETER" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
      - name: Export every locked package, with hashes
        run: >-
          uv export --all-groups --no-emit-project --format requirements.txt
          --output-file "$RUNNER_TEMP/requirements.txt"
      # pip-audit silently skips a package whose marker is false on this runner
      # (e.g. `; sys_platform == 'win32'`), but users on other platforms install it.
      - name: Drop environment markers so every package is audited
        run: sed -i -E 's/ ;[^\\]*/ /' "$RUNNER_TEMP/requirements.txt"
      - name: Audit them for known vulnerabilities
        run: >-
          uv run --only-group audit pip-audit --strict --disable-pip
          --requirement "$RUNNER_TEMP/requirements.txt"

  pr-size:
    name: PR size (warning only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Warn above ~200 changed lines
        shell: bash # adds pipefail: a failed git diff fails the step instead of counting 0
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --numstat "origin/$BASE_REF...HEAD" -- . \
              ':(exclude)uv.lock' ':(exclude)tests/fixtures/**' ':(exclude)*.md' \
            | awk '{ total += $1 + $2 } END { print total + 0 }')
          echo "Changed lines, excluding uv.lock, test fixtures and Markdown: $changed"
          if [ "$changed" -gt 200 ]; then
            echo "::warning title=PR size::$changed changed lines; the target is ~200. If this PR can't be split, explain why in its description."
          fi

  ci-passes:
    # The one check for the main-branch ruleset to require. It runs even when a
    # job it needs fails, because a skipped required check counts as passing.
    name: CI passes
    if: always()
    needs: [test, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
